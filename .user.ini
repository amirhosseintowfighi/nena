; Nena Studio — PHP settings for cPanel (PHP-FPM / LiteSpeed read this file).
; Allows larger portfolio process videos and multiple reference images.
upload_max_filesize = 128M
post_max_size = 140M
max_file_uploads = 30
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
